name: docker-release

# 打 tag 就构建并推 Docker Hub。
# 别在飞牛本机构建:国内拉 deb/基础镜像动辄十几分钟拉不完,docker push 还会被重置。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本号(不带 v),留空则用 app/__init__.py 里的"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取版本号
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' app/__init__.py)
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "将发布 mn4940128/feiying:$VER"

      - name: 版本号一致性检查
        run: |
          CODE=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' app/__init__.py)
          if [ "$CODE" != "${{ steps.v.outputs.ver }}" ]; then
            echo "::error::tag 是 ${{ steps.v.outputs.ver }},但 app/__init__.py 里是 $CODE,先对齐再发"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            mn4940128/feiying:${{ steps.v.outputs.ver }}
            mn4940128/feiying:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试
        run: |
          docker run --rm --entrypoint sh mn4940128/feiying:${{ steps.v.outputs.ver }} -c '
            set -e
            ffmpeg -version | head -1
            xray version | head -1
            python -c "import app, app.mp4probe, app.prepare; print(\"飞影\", app.__version__, \"模块加载 OK\")"
          '
